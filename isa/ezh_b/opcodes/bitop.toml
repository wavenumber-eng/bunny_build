# BITOP — opcode 0x18: bit test / set / clear / toggle.

[opcode]
name = "BITOP"
value = 0x18
family = "alu"
mnemonics_base = ["E_BTST", "E_BSET", "E_BCLR", "E_BTOG"]

[semantics]
prose = """
Tests or modifies a single bit of Rdata, selected by a register or a 5-bit
immediate: BSET sets it, BCLR clears it, BTOG toggles it, and BTST isolates
it - the destination receives Rdata AND (1 << bit), so unlike ARM's TST the
destination IS written (use GPI as the discard destination). Pair BTST with
S to set flags on the tested bit. The register-select form lets a loop walk
a bit index.
S never changes the carry flag here (C retains its previous value).
"""
restrictions = [
  "No support for SPO/SNE condition flags",
  "S with destination PC does not set flags (schedules branch instead)",
]

[timing]
cycles = "1"

[[provenance]]
source = "bunny_build"
detail = "E_BTST*/E_BSET*/E_BCLR*/E_BTOG* encoder formulas"

[[provenance]]
source = "an14650"
detail = "section 5.13: bit manipulation and testing, bit select by register or imm5, restrictions; Table 12: single cycle"

# Bit 18 = 1 selects the register-bit-number form (inverted vs the ALU family).

[[provenance]]
source = "spec_b_06"
detail = "instruction set chapter, E_BITOP purpose/options/restrictions (synthesized, not copied)"

[[forms]]
name = "reg"
brief = "Bit operation on Rdata at the bit selected by Rbit, result to DST"
syntax = "E_[COND_]{BCLR|BTST|BSET|BTOG}[S] ([cond,] dest, rdata, rbit)"
mnemonic = { pattern = "E_[COND_]{BCLR=1|BTST=5|BSET=6|BTOG=7}[S]", binds = ["cond", "bitop_sel", "s"] }
fixed = [
  { bits = "4:0", value = 0x18 },
  { bits = "18:18", value = 1 },   # 1 = bit number from register
]
operands = ["dest", "src1", "src2"]
modifiers = ["cond", "s", "bitop_sel"]
notes = "bitop_sel values used: 1=BCLR 5=BTST 6=BSET 7=BTOG. rdata rides in src1, rbit in src2."

[forms.encoding_reference]
bunny_build = "E_BSET(dest,rdata,rbit) = 0x18 + (rdata<<14) + (dest<<10) + (rbit<<20) + (1<<18) + (6<<29) + (EU<<5)"

[[forms]]
name = "imm"
brief = "Bit operation on Rdata at bit imm5, result to DST"
syntax = "E_[COND_]{BCLR|BTST|BSET|BTOG}_IMM[S] ([cond,] dest, rdata, bit5)"
mnemonic = { pattern = "E_[COND_]{BCLR=1|BTST=5|BSET=6|BTOG=7}_IMM[S]", binds = ["cond", "bitop_sel", "s"] }
fixed = [
  { bits = "4:0", value = 0x18 },
  { bits = "18:18", value = 0 },   # 0 = immediate bit number
]
operands = ["dest", "src1", "bit5"]
modifiers = ["cond", "s", "bitop_sel"]

[forms.encoding_reference]
bunny_build = "E_BSET_IMM(dest,rdata,bit5) = 0x18 + (rdata<<14) + (dest<<10) + (bit5<<24) + (6<<29) + (EU<<5)"
