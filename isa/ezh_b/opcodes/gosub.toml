# E_GOSUB — opcode 0x03: subroutine call overlay.

[opcode]
name = "GOSUB"
value = 0x03
family = "control"
mnemonics_base = ["E_GOSUB"]

[semantics]
prose = """
Calls a subroutine at an absolute 30-bit word address - any word in the
4GB space: any instruction word whose bits [1:0] are 0b11 is a GOSUB, and
the remaining 30 bits are the word address directly. RA is always
overwritten with the return address - the word after the GOSUB (hardware
analysis, advisory - creator confirmation pending) - so nested calls must stack RA
explicitly (the stack grows upward); return by branching through RA.
Because GOSUB overlays the whole encoding space, a decoder must ensure
that any word with bits [1:0] = 0b11 decodes as GOSUB. This is safe by
construction: every other defined opcode value has [1:0] != 0b11, so no
other pattern can match such a word - under most-specific-first ordering
GOSUB simply falls out last, naturally and correctly.
"""
restrictions = [
  "Target address must be word aligned (bits [1:0] of the address are implied 0b00, replaced by the 0b11 tag)",
  "No conditional variant: the cond field bits belong to the target address",
  "RA is always overwritten; preserve it manually for nesting",
  "Cannot set flags (no S variant)",
]

[timing]
cycles = "3"
notes = "Three cycles (AN14650 Table 12 row 23)"

[[provenance]]
source = "bunny_build"
detail = "E_GOSUB label prototype; two-pass assembler emits 0x03 + target address"

[[provenance]]
source = "an14650"
detail = "section 5.23: branch to immediate 30-bit word address, RA always updated for stacking/returning; Table 12: three cycles"

[[provenance]]
source = "spec_b_06"
detail = "instruction set chapter, E_GOSUB purpose/options/restrictions (synthesized, not copied)"

[[forms]]
name = "default"
brief = "Calls the 30-bit word address; RA receives the return address"
syntax = "E_GOSUB (label)"
mnemonic = { pattern = "E_GOSUB", binds = [] }
fixed = [{ bits = "1:0", value = 0x3 }]
operands = ["gosub_addr"]
modifiers = []
notes = "Only bits [1:0] are fixed; bits [4:2] of the opcode field carry address bits."

[forms.encoding_reference]
bunny_build = "E_GOSUB(a30) = 0x03 + a30  (a30 = word-aligned byte address)"
