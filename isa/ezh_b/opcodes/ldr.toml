# E_LDR — opcode 0x01: load register from memory (immediate offset).

[opcode]
name = "LDR"
value = 0x01
family = "memory"
mnemonics_base = ["E_LDR", "E_LDRB", "E_POP", "E_POPB", "E_POPBS"]

[semantics]
prose = """
Reads memory over the AHB data bus into a register, addressed by a pointer
register plus an 8-bit signed immediate offset - word-scaled for word reads,
byte-scaled for byte reads. B reads a byte (zero-extended), BS a byte with
sign extension. PRE/POST variants write the offset pointer update back to
the pointer register before or after the access. The read is submitted and
execution continues: the DFETCH unit lands the data in the background, so a
load costs one cycle unless the destination register is consumed before the
data returns. The POP aliases are presets of this form - the stack grows
upward, so POP pre-decrements SP by one word.
"""
restrictions = [
  "Post-increment of PC is not allowed",
  "A pointer register that is also the read destination gets no address update - PRE or POST, the update is ignored (hardware analysis, advisory: writeback is also silently ignored when the pointer is PC)",
  "No support for SPO/SNE condition flags",
  "Reads using CFS as the pointer see the bottom 8 bits of CFS as 0x00 (per AN14650; hardware analysis instead shows the live BS-input byte - tentatively resolved toward the latter per source ranking, creator review pending)",
  "CFS cannot be the destination of a byte read",
  "S on byte loads means signed access (bit 21), not set-flags; loads never set flags",
  "PUSH/POP: byte and word stacking must not be mixed across non-word-aligned boundaries - SP bits [1:0] are ignored in word-access address calculation (AN14650 5.29)",
  "Word accesses truncate the address to word alignment (bits [1:0] ignored)",
]

[timing]
cycles = "1+"
notes = "Read submits in a single cycle; total latency including submission is at least 2 cycles. Execution stalls only if the destination register is used (other than written) before data returns; the DFETCH unit buffers one transaction, and consecutive reads into the same register serialize (AN14650 section 5.24)"

[[provenance]]
source = "bunny_build"
detail = "E_LDR*/E_POP* encoder formulas"

[[provenance]]
source = "an14650"
detail = "sections 5.24 and 5.29: purpose, byte/sign options, scaled imm offset, PRE/POST, pointer/CFS restrictions, DFETCH latency model; PUSH/POP stack semantics (upward-growing stack)"

[[provenance]]
source = "spec_b_06"
detail = "instruction set chapter, E_LDR purpose/options/restrictions (synthesized, not copied). Note: the spec DFETCH chapter and its own E_LDR section disagree on write-stall behavior - flagged for adjudication, no side picked"

[[forms]]
name = "default"
brief = "Loads from memory at pointer + scaled offset8s into DST"
syntax = "E_[COND_]{LDRB[S]|LDR}[_PRE|_POST] ([cond,] dest, source, offset8s)"
mnemonics = [
  { pattern = "E_[COND_]{LDRB=0|LDR=1}", binds = ["cond", "word"] },
  { pattern = "E_[COND_]LDRBS", binds = ["cond"], when = { word = 0, sgn = 1 } },
  { pattern = "E_[COND_]{LDRB=0|LDR=1}_PRE", binds = ["cond", "word"], when = { wb_ld = 1 } },
  { pattern = "E_[COND_]LDRBS_PRE", binds = ["cond"], when = { word = 0, sgn = 1, wb_ld = 1 } },
  { pattern = "E_[COND_]{LDRB=0|LDR=1}_POST", binds = ["cond", "word"], when = { wb_ld = 1, post = 1 } },
  { pattern = "E_[COND_]LDRBS_POST", binds = ["cond"], when = { word = 0, sgn = 1, wb_ld = 1, post = 1 } },
]
fixed = [{ bits = "4:0", value = 0x01 }]
operands = ["dest", "src1", "offset8s"]
modifiers = ["cond", "word", "sgn", "wb_ld", "post"]
notes = "S suffix on this family means SIGNED (bit 21), not set-flags. _PRE = wb only; _POST = wb + post. Bit 9 unused."

[forms.encoding_reference]
bunny_build = "E_LDRB(dest,src,off8) = 0x1 + (dest<<10) + (src<<14) + (off8<<24) + (EU<<5)"

# Stack aliases: baked operands on the default form.

[[aliases]]
name = "POP"
brief = "Pops a word off the stack into DST (SP pre-decrements; the stack grows upward)"
form = "default"
operands = ["dest"]
preset = { src1 = 0xc, offset8s = -1, word = 1, wb_ld = 1 }

[[aliases]]
name = "POPB"
brief = "Pops a byte (zero-extended) off the stack into DST (SP pre-decrements; the stack grows upward)"
form = "default"
operands = ["dest"]
preset = { src1 = 0xc, offset8s = -1, word = 0, wb_ld = 1 }

[[aliases]]
name = "POPBS"
brief = "Pops a byte (sign-extended) off the stack into DST (SP pre-decrements; the stack grows upward)"
form = "default"
operands = ["dest"]
preset = { src1 = 0xc, offset8s = -1, word = 0, wb_ld = 1, sgn = 1 }
