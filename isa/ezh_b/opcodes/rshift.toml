# RSHIFT — opcode 0x19: register-amount barrel shift fused with ALU op.

[opcode]
name = "RSHIFT"
value = 0x19
family = "shift"
mnemonics_base = ["E_RLSL", "E_RLSR", "E_RASR", "E_RROR"]

[semantics]
prose = """
Shifts by a register-supplied amount: the bottom byte of the shift register
(0-255) drives an RLSL/RLSR/RASR/RROR of R2shift, optionally fused with an
ALU operation against Roperand in either order - shift-then-operate
(E_RLSL_ADD) or operate-then-shift (E_ADD_RLSL); the mnemonic spells the
execution order, and N inverts the ALU result. This is the variable-shift
workhorse for bit-packing loops whose field widths are computed at run time.
(Note: AN14650 5.12's description sentence says "byte or bit order flipping"
- a copy-paste from 5.11; its own options list and the encoding model agree
this family shifts by the lower 8 bits of a register.) Amounts of 32 and
above still need bench confirmation. The model used here rotates amounts
modulo 32 and saturates shifts - the value shifts fully out, with the carry
capturing the last bit at exactly 32 and clearing beyond 32.
With SPO/SNE and an LSL by 1, the carry is automatically shifted into the
LSB - the tailchaining idiom for chaining shift work across registers.
SPO/SNE cancel only the fused ALU stage here (see the shift family for
the full algorithmic-flags story). This family is the one that carries BOTH
geometries, selected by the order bit, so the surviving operand differs
within it: cancellation passes through the ALU's LEFT operand, which for
shift-then-operate (E_RLSL_ADD) is the shifted src2, and for
operate-then-shift (E_ADD_RLSL) is src1, which then still goes through the
shift stage. Same rule as the immediate-shift and post-shift families -
applied twice, because both orders live here. For fused ADC/SBC with a
nonzero shift amount, treat the carry-in as coming from the shift stage rather
than the CA flag unless a bench test says otherwise.
"""
restrictions = [
  "S with destination PC does not set flags (schedules branch instead)",
  "Shift-amount register is a 3-bit field: R0-R7 only (bit 27 is the N modifier)",
  "Shift amounts >= 32 follow the model described above, but still need bench confirmation",
]

[timing]
cycles = "1"

[[provenance]]
source = "bunny_build"
detail = "E_R*/E_*_R* register-shift encoder formulas"

[[provenance]]
source = "an14650"
detail = "section 5.12: shift by lower 8 bits of a register + optional ALU op + optional inversion (description sentence there is a 5.11 copy-paste error); Table 12: single cycle"

[[provenance]]
source = "spec_b_06"
detail = "instruction set chapter, E_RSHIFT purpose/options/restrictions (synthesized, not copied)"

[[provenance]]
source = "sv_tb"
detail = "ADVISORY: shift_by_32_or_more logic - rotate uses amount mod 32; shifts >= 32 saturate (carry = last bit at exactly 32, cleared beyond)"

[[forms]]
name = "default"
brief = "Shifts R2shift by the low byte of Rshift (0-255), result to DST"
syntax = "E_[COND_]R{LSL|ASR|LSR|ROR}[N][_op][S] / E_[COND_]op[N]_R{LSL|ASR|LSR|ROR}[S] ([cond,] dest, roperand, r2shift, rshift)"
mnemonics = [
  { pattern = "E_[COND_]{RLSL=0|RASR=1|RLSR=2|RROR=3}[N][S]", binds = ["cond", "shift_type", "n_rshift", "s"] },
  { pattern = "E_[COND_]{RLSL=0|RASR=1|RLSR=2|RROR=3}_{AND=1|OR=2|XOR=3|ADD=4|SUB=5|ADC=6|SBC=7}[N][S]", binds = ["cond", "shift_type", "fuse_op", "n_rshift", "s"], when = { order_rshift = 0 } },
  { pattern = "E_[COND_]{AND=1|OR=2|XOR=3|ADD=4|SUB=5|ADC=6|SBC=7}[N]_{RLSL=0|RASR=1|RLSR=2|RROR=3}[S]", binds = ["cond", "fuse_op", "n_rshift", "shift_type", "s"], when = { order_rshift = 1 } },
]
fixed = [{ bits = "4:0", value = 0x19 }]
operands = ["dest", "src1", "src2", "rshift3"]
modifiers = ["cond", "s", "shift_type", "fuse_op", "order_rshift", "n_rshift"]
notes = "src1 is the fused ALU operand (fuse_op != 0 only), src2 the shifted register, rshift3 the shift-amount register. order 0 = shift-then-op (RLSL_ADD), 1 = op-then-shift (ADD_RLSL). N attaches to the op name in the mnemonic."

[forms.encoding_reference]
bunny_build = "E_ADD_RLSL(dest,rop,r2s,rsh) = 0x19 + (rop<<14) + (dest<<10) + (r2s<<20) + (rsh<<24) + (4<<29) + (1<<28) + (EU<<5)"
