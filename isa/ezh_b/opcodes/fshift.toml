# FSHIFT — opcode 0x11: flip (endian or bit-reverse) + shift, optional fused ALU op.

[opcode]
name = "FSHIFT"
value = 0x11
family = "shift"
mnemonics_base = ["E_FEND_LSR", "E_FEND_ASR", "E_FBIT_LSR", "E_FBIT_ASR"]

[semantics]
prose = """
Flips the operand's byte order (FEND) or bit order (FBIT), right-shifts the
flipped value (LSR or ASR by a 0-31 immediate), then optionally applies a
fused ALU operation with the flipped-and-shifted value as the LEFT operand
(dest = shifted OP Roperand - the order matters for SUB/SBC). Bit-order flip converts LSB-first
serial data to MSB-first and back; byte-order flip converts endianness -
with the shift and ALU stage this normalizes protocol data in one cycle.
SPO/SNE cancel only the fused ALU stage here (see the shift family for
the full algorithmic-flags story).
"""
restrictions = [
  "S with destination PC does not set flags (schedules branch instead)",
  "Only right shifts (LSR/ASR) exist in this family",
]

[timing]
cycles = "1"

[[provenance]]
source = "bunny_build"
detail = "E_FEND_*/E_FBIT_* encoder formulas"

[[provenance]]
source = "an14650"
detail = "section 5.11: preswap endianness/bitwise + right shift + ALU operation; Table 12: single cycle. Its options bullet erroneously lists LSL/ROR - the intro, Table 32, and Table 12 are right-shift-only (AN14650 defect #4)"

[[provenance]]
source = "spec_b_06"
detail = "instruction set chapter, E_FSHIFT purpose/options/restrictions (synthesized, not copied)"

[[forms]]
name = "default"
brief = "Flips R2shift, then right-shifts it by Shift5imm, result to DST"
syntax = "E_[COND_]{FEND|FBIT}_{LSR|ASR}[_{AND|OR|XOR|ADD|SUB|ADC|SBC}][S] ([cond,] dest, [roperand,] r2shift, shift5)"
mnemonics = [
  { pattern = "E_[COND_]{FEND=0|FBIT=1}_{LSR=0|ASR=1}[S]", binds = ["cond", "fbit", "asr_sel", "s"] },
  { pattern = "E_[COND_]{FEND=0|FBIT=1}_{LSR=0|ASR=1}_{AND=1|OR=2|XOR=3|ADD=4|SUB=5|ADC=6|SBC=7}[S]", binds = ["cond", "fbit", "asr_sel", "fuse_op", "s"] },
]
fixed = [{ bits = "4:0", value = 0x11 }]
operands = ["dest", "src1", "src2", "shift5"]
modifiers = ["cond", "s", "fbit", "asr_sel", "fuse_op"]
notes = "Same operand layout as opcode 0x10: src1 is the fused ALU operand, src2 the flipped/shifted register."

[forms.encoding_reference]
bunny_build = "E_FBIT_ASR(dest,r2s,sh5) = 0x11 + (dest<<10) + (r2s<<20) + (sh5<<24) + (1<<18) + (1<<19) + (EU<<5)"
