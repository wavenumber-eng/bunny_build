# E_TIGHT_LOOP — opcode 0x1a: hardware loop.

[opcode]
name = "TIGHT_LOOP"
value = 0x1a
family = "control"
mnemonics_base = ["E_TIGHT_LOOP"]

[semantics]
prose = """
Configures the Execution Supervisor for zero-overhead looping: Rend points one
word past the loop body's final opcode, and Rcount gives how many times the block repeats after its first
pass - the body runs Rcount + 1 times in total. The instruction immediately
following E_TIGHT_LOOP executes once only; the instruction after that is the
first instruction of the repeated block. Iteration tracking and the branch
back cost no instruction cycles.
"""
restrictions = [
  "The instruction immediately following E_TIGHT_LOOP executes only once; the repeated block starts at the instruction after it",
  "To repeat a single instruction, set Rend to 3 words past the E_TIGHT_LOOP address",
  "Cannot set flags (no S variant)",
]

[timing]
cycles = "1"

[[provenance]]
source = "bunny_build"
detail = "E_TIGHT_LOOP(rend,rcount) = 0x1A + (rend<<14) + (rcount<<20)"

[[provenance]]
source = "an14650"
detail = "section 5.15: execution supervisor, Rend/Rcount semantics (runs count+1 times), single-instruction-loop rule; Table 12: single cycle"

[[provenance]]
source = "spec_b_06"
detail = "instruction set chapter, E_TIGHT_LOOP purpose/options/restrictions (synthesized, not copied)"

[[forms]]
name = "default"
syntax = "E_[COND_]TIGHT_LOOP ([cond,] rend, rcount)"
mnemonic = { pattern = "E_[COND_]TIGHT_LOOP", binds = ["cond"] }
fixed = [{ bits = "4:0", value = 0x1a }]
operands = ["src1", "src2"]
modifiers = ["cond"]
notes = "End-address register rides in src1 [17:14], loop count register in src2 [23:20]."

[forms.encoding_reference]
bunny_build = "E_TIGHT_LOOP(rend,rcount) = 0x1A + (rend<<14) + (rcount<<20)"
