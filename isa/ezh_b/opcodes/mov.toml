# E_MOV — opcode 0x00: register move / immediate load family.

[opcode]
name = "MOV"
value = 0x00
family = "data-movement"
mnemonics_base = ["E_MOV", "E_MVN", "E_LOAD_IMM", "E_LOAD_SIMM"]

[semantics]
prose = """
Moves data into a register: MOV copies a source register, MVN copies its
bitwise inverse (the N modifier), LOAD_IMM loads an 11-bit signed immediate,
and LOAD_SIMM additionally shifts that immediate left by 0-31 bit positions
before loading - the idiom for building constants and masks without a memory
access. MOVS (S) is the canonical way to test a register value. Writing PC as the
destination branches - ordinary unless S is set, which schedules the branch
(and sets no flags).
S sets the flags but never the carry: C retains its previous value.
To test a value without storing a result (the CMP/TST idiom), use GPI as
the discard destination.
"""
restrictions = [
  "No support for SPO/SNE condition flags",
  "S with destination PC does not set flags (schedules branch instead)",
]

[timing]
cycles = "1"

[[provenance]]
source = "fsl_header"
detail = "E_MOV / E_MVN / E_LOAD_IMM / E_LOAD_SIMM macro encodings"

[[provenance]]
source = "spec_b_06"
detail = "instruction set chapter, E_MOV purpose/options/restrictions (synthesized, not copied)"

[[provenance]]
source = "an14650"
detail = "section 5.1: purpose, options (reg-to-reg, imm-to-reg, 11-bit signed imm shiftable left 0-31), restrictions; Table 12: single cycle"

# ---------------------------------------------------------------------------
# Form 1: register to register.  E_[COND_]MOV[N][S] (cond,) dest, src
# ---------------------------------------------------------------------------

[[forms]]
name = "reg"
brief = "Moves SRC1 into DST"
syntax = "E_[COND_]{MOV|MVN}[S] ([cond,] dest, src)"
mnemonic = { pattern = "E_[COND_]{MOV|MVN}[S]", binds = ["cond", "n", "s"] }
fixed = [
  { bits = "4:0", value = 0x00 },
  { bits = "18:18", value = 0 },   # 0 = register form (1 selects immediate form)
]
operands = ["dest", "src1"]
modifiers = ["cond", "s", "n"]

[forms.encoding_reference]
bunny_build = "E_MOV(dest,src) = 0x0 + (src<<14) + (dest<<10) + (EU<<5)"

# ---------------------------------------------------------------------------
# Form 2: immediate load.  E_[COND_]LOAD_[S]IMM[N][S] (cond,) dest, imm11s (,shift5)
# ---------------------------------------------------------------------------

[[forms]]
name = "imm"
syntax = "E_[COND_]LOAD_{IMM|SIMM}[N][S] ([cond,] dest, imm11s [, shift5_simm])"
mnemonics = [
  { pattern = "E_[COND_]LOAD_IMM[N][S]", binds = ["cond", "n", "s"], brief = "Loads the 11-bit signed immediate into DST - the same encoding as LOAD_SIMM with shift5 = 0, with the shift argument omitted" },
  { pattern = "E_[COND_]LOAD_SIMM[N][S]", binds = ["cond", "n", "s"], brief = "Loads the 11-bit signed immediate, shifted left by shift5 (0-31, a split field), into DST" },
]
fixed = [
  { bits = "4:0", value = 0x00 },
  { bits = "18:18", value = 1 },   # immediate form select
]
operands = ["dest", "imm11s", "shift5_simm"]
modifiers = ["cond", "s", "n"]
notes = "LOAD_IMM is LOAD_SIMM with shift5 = 0. shift5 is a split field."

[forms.encoding_reference]
bunny_build = "E_LOAD_SIMM(dest,imm,sam) = 0x0 + (dest<<10) + ((imm&0x7ff)<<20) + (1<<18) + (EU<<5) + ((sam&0xf)<<14) + (((sam&0x10)>>4)<<19)"
