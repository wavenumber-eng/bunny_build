# E_ADD — opcode 0x06: add family (ALU matrix).
#
# All seven ALU opcodes (0x06 ADD, 0x08 SUB, 0x09 ADC, 0x0a SBC, 0x0c OR,
# 0x0d AND, 0x0e XOR) share this exact structure; only the opcode value and
# operation differ.

[opcode]
name = "ADD"
value = 0x06
family = "alu"
mnemonics_base = ["E_ADD"]

[semantics]
prose = """
Adds two registers (dest = src1 + src2) or a register and a 12-bit
signed immediate.
The result then passes through the optional post-stages in mnemonic-spelling
order: N inverts it, F flips its byte order, and a fused LSL/LSR/ASR/ROR
shifts or rotates it by a 0-31 immediate; flags (S) update last. The IMM form
uses a 12-bit signed immediate with N and S only (the immediate occupies the
shift bits). Writing PC as the destination branches - an ordinary
branch unless S is set, which makes it a scheduled branch (and sets no
flags).
SPO/SNE conditions are legal with this family - the algorithmic
shift+ALU idiom (see the shift family for their full semantics).
"""
restrictions = [
  "S with destination PC does not set flags (schedules branch instead)",
  "IMM form has no shift fusion (immediate occupies the shift bits)",
]

[timing]
cycles = "1"

[[provenance]]
source = "bunny_build"
detail = "E_ADD* encoder formulas (family matrix extracted by isa/tools/extract_header.py)"

[[provenance]]
source = "an14650"
detail = "section 5.2: purpose, options (invertible data, result byte-order flip, postshift 0-31), imm12s, PC restriction; Table 12: single cycle"

[[provenance]]
source = "spec_b_06"
detail = "instruction set chapter, E_ADD purpose/options/restrictions (synthesized, not copied)"

# ---------------------------------------------------------------------------
# Form 1: register-register with optional immediate-shift fusion.
# Plain E_ADD[N][S] is LSL with shift5 = 0; E_ADD[N]_F[S] is FLSL with shift5 = 0.
# ---------------------------------------------------------------------------
[[forms]]
name = "reg"
brief = "Adds SRC2 to SRC1, result to DST"
syntax = "E_[COND_]ADD[N]_[F]{LSL|ASR|LSR|ROR}[S] ([cond,] dest, src1, src2 [, shift5])"
mnemonics = [
  { pattern = "E_[COND_]ADD[N][S]", binds = ["cond", "n_alu", "s"] },
  { pattern = "E_[COND_]ADD[N]_{LSL=0|ASR=1|LSR=2|ROR=3}[S]", binds = ["cond", "n_alu", "shift_type_alu", "s"] },
  { pattern = "E_[COND_]ADD[N]_{F=1}[S]", binds = ["cond", "n_alu", "f_alu", "s"] },
  { pattern = "E_[COND_]ADD[N]_{F=1}{LSL=0|ASR=1|LSR=2|ROR=3}[S]", binds = ["cond", "n_alu", "f_alu", "shift_type_alu", "s"] },
]
fixed = [
  { bits = "4:0", value = 0x06 },
  { bits = "18:18", value = 0 },   # 0 = register form (1 selects immediate form)
]
operands = ["dest", "src1", "src2", "shift5"]
modifiers = ["cond", "s", "n_alu", "f_alu", "shift_type_alu"]
notes = "Mnemonics without a shift suffix are the LSL encoding with shift5 = 0."

[forms.encoding_reference]
bunny_build = "E_ADD(dest,src1,src2) = 0x6 + (src1<<14) + (dest<<10) + (src2<<20) + (EU<<5)"

# ---------------------------------------------------------------------------
# Form 2: register + 12-bit signed immediate.
# ---------------------------------------------------------------------------

[[forms]]
name = "imm"
brief = "Adds the 12-bit signed immediate to SRC1, result to DST"
syntax = "E_[COND_]ADD[N]_IMM[S] ([cond,] dest, src1, imm12s)"
mnemonic = { pattern = "E_[COND_]ADD[N]_IMM[S]", binds = ["cond", "n_alu", "s"] }
fixed = [
  { bits = "4:0", value = 0x06 },
  { bits = "18:18", value = 1 },   # immediate form select
]
operands = ["dest", "src1", "imm12s"]
modifiers = ["cond", "s", "n_alu"]

[forms.encoding_reference]
bunny_build = "E_ADD_IMM(dest,src1,imm) = 0x6 + (src1<<14) + (dest<<10) + ((imm&0xfff)<<20) + (1<<18) + (EU<<5)"
