# MEM_REG — opcode 0x1d: load/store with register offset.

[opcode]
name = "MEM_REG"
value = 0x1d
family = "memory"
mnemonics_base = ["E_LDR_REG", "E_LDR_REGB", "E_STR_REG", "E_STR_REGB"]

[semantics]
prose = """
Register-plus-register addressed memory access: LDR_REG reads and STR_REG
writes at Raddr + Roffset (bit 30 selects the direction), for walking
buffers whose stride lives in a register. Loads come in word, byte (B), and
sign-extended byte (BS) forms; stores in word and byte. Performance matches
the immediate-offset E_LDR and E_STR: the access is submitted in one cycle
and DFETCH lands read data in the background.
"""
restrictions = [
  "No support for SPO/SNE condition flags",
  "Reads using CFS as the pointer see the bottom 8 bits of CFS as 0x00",
  "CFS cannot be the destination of a byte read",
  "S on byte loads means signed access (bit 21), not set-flags; no flag setting in this family",
]

[timing]
cycles = "1+"
notes = "Same performance as E_LDR: single-cycle submission, total latency at least 2 cycles, stalls only on early use of the destination (AN14650 sections 5.26-5.27)"

[[provenance]]
source = "bunny_build"
detail = "E_LDR_REG*/E_STR_REG* encoder formulas"

[[provenance]]
source = "an14650"
detail = "sections 5.26-5.27: register+register addressing, byte/sign options, CFS restrictions, performance same as E_LDR"

[[provenance]]
source = "spec_b_06"
detail = "instruction set chapter, E_MEM_REG purpose/options/restrictions (synthesized, not copied)"

[[forms]]
name = "load"
syntax = "E_[COND_]LDR_REG[B][S] ([cond,] dest, source, roffset)"
mnemonics = [
  { pattern = "E_[COND_]{LDR_REGB=0|LDR_REG=1}", binds = ["cond", "word"] },
  { pattern = "E_[COND_]LDR_REGBS", binds = ["cond"], when = { sgn = 1 } },
]
fixed = [
  { bits = "4:0", value = 0x1d },
  { bits = "30:30", value = 0 },   # 0 = load
]
operands = ["dest", "src1", "roffset"]
modifiers = ["cond", "word", "sgn"]
notes = "S suffix means SIGNED (bit 21), as in the LDR family. Base register in src1 [17:14], offset register in roffset [27:24]."

[forms.encoding_reference]
bunny_build = "E_LDR_REGB(dest,src,roff) = 0x1D + (dest<<10) + (src<<14) + (roff<<24) + (EU<<5)"

[[forms]]
name = "store"
syntax = "E_[COND_]STR_REG[B] ([cond,] raddr, rdata, roffset)"
mnemonic = { pattern = "E_[COND_]{STR_REGB=0|STR_REG=1}", binds = ["cond", "word"] }
fixed = [
  { bits = "4:0", value = 0x1d },
  { bits = "30:30", value = 1 },   # 1 = store
]
operands = ["src1", "src2", "roffset"]
modifiers = ["cond", "word"]
notes = "Address register in src1 [17:14], data register in src2 [23:20]."

[forms.encoding_reference]
bunny_build = "E_STR_REGB(raddr,rdata,roff) = 0x1D + (raddr<<14) + (rdata<<20) + (roff<<24) + (1<<30) + (EU<<5)"
