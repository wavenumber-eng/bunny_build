# E_PER_WRITE — opcode 0x05: single-cycle peripheral register write.
# Showcase for a split address field: the 20-bit address is scattered across
# two instruction bit ranges.

[opcode]
name = "PER_WRITE"
value = 0x05
family = "peripheral-access"
mnemonics_base = ["E_PER_WRITE"]

[semantics]
prose = """
Writes a source register to a peripheral register with pure immediate
addressing. The 20-bit immediate is a
word-aligned byte offset from 0x4000_0000 (bits [1:0] forced to zero),
reaching a 22-bit / 4MB region of the Cortex-M peripheral space - no
register needs to be spent on peripheral addressing. Performance matches
E_LDR: submitted in one cycle, data lands via DFETCH.
"""
restrictions = [
  "Address must be word aligned",
  "No support for SPO/SNE condition flags",
  "Cannot set flags (no S variant)",
]

[timing]
cycles = "1+"
notes = "Same performance as E_LDR (AN14650 section 5.28)"

[[provenance]]
source = "fsl_header"
detail = "E_PER_WRITE macro encoding (split address)"

[[provenance]]
source = "an14650"
detail = "section 5.28: peripheral write, 20-bit imm word offset from 0x40000000 covering a 22-bit region, performance same as E_LDR"

[[provenance]]
source = "spec_b_06"
detail = "instruction set chapter, E_PER_WRITE purpose/options/restrictions (synthesized, not copied)"

[[forms]]
name = "default"
syntax = "E_[COND_]PER_WRITE ([cond,] src, addr20)"
mnemonic = { pattern = "E_[COND_]PER_WRITE", binds = ["cond"] }
fixed = [
  { bits = "4:0", value = 0x05 },
]
operands = ["src2", "per_addr20_w"]
modifiers = ["cond"]
notes = "Source register rides in bits [23:20] (src2 position)."

[forms.encoding_reference]
bunny_build = "E_PER_WRITE(src,addr20) = 0x5 + (src<<20) + ((addr20&0xff000)<<12) + ((addr20&0xffc)<<8) + (EU<<5)"
