# E_PER_READ — opcode 0x04: single-cycle peripheral register read.

[opcode]
name = "PER_READ"
value = 0x04
family = "peripheral-access"
mnemonics_base = ["E_PER_READ"]

[semantics]
prose = """
Reads a peripheral register into a destination register with pure
immediate addressing: the immediate is a word-aligned byte offset from
0x4000_0000 (bits [1:0] forced to zero; 18 offset bits are encoded),
reaching the 1MB peripheral window - no register needs to be spent on
peripheral addressing. Performance matches E_LDR: submitted in one cycle,
data lands via DFETCH. (Note: AN14650 5.28 says the offset "covers a 22-bit
offset region" - arithmetically impossible for the encoded field; the hardware
address computation, both headers, and real camera code agree on 1MB.)
The macro argument is the offset itself, not the absolute peripheral
address.
"""
restrictions = [
  "Address must be word aligned",
  "No support for SPO/SNE condition flags",
  "Cannot set flags (no S variant)",
]

[timing]
cycles = "1+"
notes = "Same performance as E_LDR: single-cycle submission, total latency at least 2 cycles, stalls only on early use of the destination (AN14650 section 5.28)"

[[provenance]]
source = "fsl_header"
detail = "E_PER_READ macro encoding"

[[provenance]]
source = "an14650"
detail = "section 5.28: peripheral read, immediate offset from 0x40000000, performance same as E_LDR. Its 22-bit-region note contradicts the 18-bit encoded field (AN14650 defect #3, recorded in prose)"

[[provenance]]
source = "spec_b_06"
detail = "instruction set chapter, E_PER_READ purpose/options/restrictions (synthesized, not copied)"

[[forms]]
name = "default"
brief = "Reads the peripheral at 0x4000_0000 + offset into DST"
syntax = "E_[COND_]PER_READ ([cond,] dest, addr20)"
mnemonic = { pattern = "E_[COND_]PER_READ", binds = ["cond"] }
fixed = [{ bits = "4:0", value = 0x04 }]
operands = ["dest", "per_addr20_r"]
modifiers = ["cond"]
notes = "Unlike PER_WRITE, the address field is contiguous: instr [31:14] <- addr [19:2]."

[forms.encoding_reference]
bunny_build = "E_PER_READ(dest,addr20) = 0x4 + (dest<<10) + ((addr20&0xffffc)<<12) + (EU<<5)"
