# E_AND — opcode 0x0d: and family (ALU matrix).

[opcode]
name = "AND"
value = 0x0d
family = "alu"
mnemonics_base = ["E_AND"]

[semantics]
prose = """
Bitwise ANDs (dest = src1 AND src2, or src1 AND imm12s) - the mask
primitive.
The result then passes through the optional post-stages in mnemonic-spelling
order: N inverts it, F flips its byte order, and a fused LSL/LSR/ASR/ROR
shifts or rotates it by a 0-31 immediate; flags (S) update last. The IMM form
uses a 12-bit signed immediate with N and S only (the immediate occupies the
shift bits). Writing PC as the destination branches - an ordinary
branch unless S is set, which makes it a scheduled branch (and sets no
flags).
S here never changes the carry flag: only ADD/SUB/ADC/SBC and shifts
can affect C, so C retains its previous value.
SPO/SNE conditions are legal with this family - the algorithmic
shift+ALU idiom (see the shift family for their full semantics). When they
cancel the ALU stage, it passes through its LEFT operand: here that is src1,
which then still goes through any N inversion and fused post-shift before
writeback. src2 is discarded.
"""
restrictions = [
  "S with destination PC does not set flags (schedules branch instead)",
  "IMM form has no shift fusion (immediate occupies the shift bits)",
]

[timing]
cycles = "1"

[[provenance]]
source = "bunny_build"
detail = "E_AND* encoder formulas (family matrix extracted by isa/tools/extract_header.py)"

[[provenance]]
source = "spec_b_06"
detail = "surviving-operand rule under SPO/SNE cancellation: the spec's worked example E_COND_ADDN_LSL(SPO,R1,R2,R3,24) states the result is R2 (src1) inverted then shifted left by 24, i.e. the ALU passes through its left operand while the inversion and post-shift still run (synthesized, not copied)"

[[provenance]]
source = "an14650"
detail = "section 5.6: purpose, options (invertible data, result byte-order flip, postshift 0-31), imm12s, PC restriction; Table 12: single cycle"

[[provenance]]
source = "spec_b_06"
detail = "instruction set chapter, E_AND purpose/options/restrictions (synthesized, not copied)"

# ---------------------------------------------------------------------------
# Form 1: register-register with optional immediate-shift fusion.
# Plain E_AND[N][S] is LSL with shift5 = 0; E_AND[N]_F[S] is FLSL with shift5 = 0.
# ---------------------------------------------------------------------------
[[forms]]
name = "reg"
brief = "ANDs SRC1 with SRC2, result to DST"
syntax = "E_[COND_]AND[N]_[F]{LSL|ASR|LSR|ROR}[S] ([cond,] dest, src1, src2 [, shift5])"
mnemonics = [
  { pattern = "E_[COND_]AND[N][S]", binds = ["cond", "n_alu", "s"] },
  { pattern = "E_[COND_]AND[N]_{LSL=0|ASR=1|LSR=2|ROR=3}[S]", binds = ["cond", "n_alu", "shift_type_alu", "s"] },
  { pattern = "E_[COND_]AND[N]_{F=1}[S]", binds = ["cond", "n_alu", "f_alu", "s"] },
  { pattern = "E_[COND_]AND[N]_{F=1}{LSL=0|ASR=1|LSR=2|ROR=3}[S]", binds = ["cond", "n_alu", "f_alu", "shift_type_alu", "s"] },
]
fixed = [
  { bits = "4:0", value = 0x0d },
  { bits = "18:18", value = 0 },   # 0 = register form (1 selects immediate form)
]
operands = ["dest", "src1", "src2", "shift5"]
modifiers = ["cond", "s", "n_alu", "f_alu", "shift_type_alu"]
notes = "Mnemonics without a shift suffix are the LSL encoding with shift5 = 0."

[forms.encoding_reference]
bunny_build = "E_AND(dest,src1,src2) = 0xd + (src1<<14) + (dest<<10) + (src2<<20) + (EU<<5)"

# ---------------------------------------------------------------------------
# Form 2: register + 12-bit signed immediate.
# ---------------------------------------------------------------------------

[[forms]]
name = "imm"
brief = "ANDs SRC1 with the 12-bit signed immediate, result to DST"
syntax = "E_[COND_]AND[N]_IMM[S] ([cond,] dest, src1, imm12s)"
mnemonic = { pattern = "E_[COND_]AND[N]_IMM[S]", binds = ["cond", "n_alu", "s"] }
fixed = [
  { bits = "4:0", value = 0x0d },
  { bits = "18:18", value = 1 },   # immediate form select
]
operands = ["dest", "src1", "imm12s"]
modifiers = ["cond", "s", "n_alu"]

[forms.encoding_reference]
bunny_build = "E_AND_IMM(dest,src1,imm) = 0xd + (src1<<14) + (dest<<10) + ((imm&0xfff)<<20) + (1<<18) + (EU<<5)"
