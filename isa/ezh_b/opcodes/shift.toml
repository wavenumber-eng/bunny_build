# SHIFT — opcode 0x10: immediate barrel shift with optional fused ALU op.

[opcode]
name = "SHIFT"
value = 0x10
family = "shift"
mnemonics_base = ["E_LSL", "E_LSR", "E_ASR", "E_ROR"]

[semantics]
prose = """
Shifts a register by a 5-bit immediate amount (LSL/LSR/ASR/ROR), optionally
fusing the shifted value into an ALU operation with a second register operand
(shift first, then ALU op). Without fusion the shifted value is written
directly to the destination.
"""
restrictions = []

[timing]
cycles = "1"

[[provenance]]
source = "bunny_build"
detail = "E_LSL*/E_LSR*/E_ASR*/E_ROR* encoder formulas"

[[provenance]]
source = "an14650"
detail = "section 5, shift instruction group"

[[forms]]
name = "default"
syntax = "E_[COND_]{LSL|ASR|LSR|ROR}[_{AND|OR|XOR|ADD|SUB|ADC|SBC}][S] ([cond,] dest, [roperand,] r2shift, shift5)"
mnemonic = { pattern = "E_[COND_]{LSL|ASR|LSR|ROR}[_FUSEOP][S]", binds = ["cond", "shift_type", "fuse_op", "s"] }
fixed = [{ bits = "4:0", value = 0x10 }]
operands = ["dest", "src1", "src2", "shift5"]
modifiers = ["cond", "s", "shift_type", "fuse_op"]
notes = "src1 [17:14] is the ALU operand register, present only when fuse_op != 0. src2 [23:20] is the register being shifted."

[forms.encoding_reference]
bunny_build = "E_LSL_ADD(dest,rop,r2s,sh5) = 0x10 + (rop<<14) + (dest<<10) + (r2s<<20) + (sh5<<24) + (4<<29) + (EU<<5)"
