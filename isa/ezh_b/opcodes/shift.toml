# SHIFT — opcode 0x10: immediate barrel shift with optional fused ALU op.

[opcode]
name = "SHIFT"
value = 0x10
family = "shift"
mnemonics_base = ["E_LSL", "E_LSR", "E_ASR", "E_ROR"]

[semantics]
prose = """
Pre-shifts or pre-rotates a register, then optionally feeds the shifted
value through an ALU operation: dest = (R2shift shifted by a 0-31
immediate) OP Roperand, with OP one of ADD/ADC/SUB/SBC/AND/OR/XOR - the
shifted value is the LEFT operand, which matters for SUB/SBC - or a plain
shift when no operation is fused. The mnemonic spells execution order:
E_LSL_ADD shifts first, then adds. Together with the SPO/SNE conditions this
family implements the algorithmic shift-and-accumulate idiom.
The algorithmic conditions in full: SPO/SNE cancel only the fused ALU
stage - the shift and the writeback still execute, and an N inversion is
NOT cancelled; the algorithmic flags themselves latch only from an opcode
that was conditioned on SPO/SNE. This is the binary-multiply idiom: shift
every iteration, operate only when the MSB says so. (hardware analysis, advisory: a
fused ADC/SBC with a nonzero shift amount takes its carry-in from the
shift stage, not the CA flag.)
"""
restrictions = [
  "S with destination PC does not set flags (schedules branch instead)",
]

[timing]
cycles = "1"

[[provenance]]
source = "bunny_build"
detail = "E_LSL*/E_LSR*/E_ASR*/E_ROR* encoder formulas"

[[provenance]]
source = "an14650"
detail = "section 5.10: preshift + ALU operation, shift by imm 0-31; Table 12: single cycle"

[[provenance]]
source = "spec_b_06"
detail = "instruction set chapter, E_SHIFT purpose/options/restrictions (synthesized, not copied)"

[[forms]]
name = "default"
syntax = "E_[COND_]{LSL|ASR|LSR|ROR}[_{AND|OR|XOR|ADD|SUB|ADC|SBC}][S] ([cond,] dest, [roperand,] r2shift, shift5)"
mnemonics = [
  { pattern = "E_[COND_]{LSL=0|ASR=1|LSR=2|ROR=3}[S]", binds = ["cond", "shift_type", "s"] },
  { pattern = "E_[COND_]{LSL=0|ASR=1|LSR=2|ROR=3}_{AND=1|OR=2|XOR=3|ADD=4|SUB=5|ADC=6|SBC=7}[S]", binds = ["cond", "shift_type", "fuse_op", "s"] },
]
fixed = [{ bits = "4:0", value = 0x10 }]
operands = ["dest", "src1", "src2", "shift5"]
modifiers = ["cond", "s", "shift_type", "fuse_op"]
notes = "src1 [17:14] is the ALU operand register, present only when fuse_op != 0. src2 [23:20] is the register being shifted."

[forms.encoding_reference]
bunny_build = "E_LSL_ADD(dest,rop,r2s,sh5) = 0x10 + (rop<<14) + (dest<<10) + (r2s<<20) + (sh5<<24) + (4<<29) + (EU<<5)"
