# HOLD — opcode 0x1c: halt / wait-for-event, plain and vectored.

[opcode]
name = "HOLD"
value = 0x1c
family = "control"
mnemonics_base = ["E_HOLD", "E_VECTORED_HOLD", "E_ACC_VECTORED_HOLD"]

[semantics]
prose = """
Halts execution until the Boolean pattern detector fires. Plain HOLD parks
at the opcode until the bit-slice detector (configured through CFS/CFM)
evaluates true, then falls through. VECTORED_HOLD monitors several ORed
conditions at once and dispatches through a vector table when any fires:
slice 0 has the highest priority, and an ANDed slice group dispatches on its
last slice. The first table entry lives at the table register value + 4
(PC works as the base when the table follows two unflushed opcodes); entries
are one word each, or four words with LV (large vector) - room for a
scheduled branch, its two unflushed opcodes, and one more instruction. By
default the resume address is backed up to RA so the handler can return; NRA
suppresses that. ACC variants carry a per-vector acceleration mask in
[31:24] (bit 24+n accelerates vector n): for an accelerated vector the two
already-prefetched opcodes are not flushed, so handler work starts during
the dispatch. The minimum monitor-to-handler-to-monitor round trip is 4
cycles.
"""
restrictions = [
  "SPO/SNE conditions cause an unpredictable result",
  "Cannot set flags (no S variant; ACC rides the flag bit)",
  "Pattern detection stalls until any outstanding reads into CFS/CFM have returned",
  "Conditional on BS: the BS flag is not guaranteed to match the HOLD's own detector evaluation unless the detector inputs are stable",
]

[timing]
cycles = "1"
notes = "Issues in a single cycle, then halts until the Boolean pattern is matched (AN14650 Table 12 row 16)"

[[provenance]]
source = "bunny_build"
detail = "E_HOLD/E_VECTORED_HOLD*/E_ACC_VECTORED_HOLD* encoder formulas"

[[provenance]]
source = "an14650"
detail = "section 5.16: hold until Boolean pattern, vectored dispatch, NRA/LV/ACC options, table-register+4 first-vector rule; Table 12: single cycle"

[[provenance]]
source = "fsl_header"
detail = "all four COND_*_NRA macros (lines 3277-3296) have a space before the parameter list and can never expand; intended encodings verified. Header comments name the LV variants 'Large Vector Versions'"

[[provenance]]
source = "sv_tb"
detail = "ADVISORY: e_boolean decodes plain-HOLD via bit 15, NRA bit 18 (RA write to reg 15 executes only when clear), LV bit 19 (16- vs 4-byte table stride), ACC bit 9, acceleration bits [31:24]; reads the table register ONLY from [23:20] - the [13:10] replica is never consumed (decode significance of the replica is on the adjudication list)"

[[provenance]]
source = "spec_b_06"
detail = "instruction set chapter, E_HOLD purpose/options/restrictions (synthesized, not copied)"

# ---------------------------------------------------------------------------
# Plain HOLD: dest slot fixed to PC, bit 15 set.
# ---------------------------------------------------------------------------
[[forms]]
name = "plain"
syntax = "E_[COND_]HOLD ([cond])"
mnemonic = { pattern = "E_[COND_]HOLD", binds = ["cond"] }
fixed = [
  { bits = "4:0", value = 0x1c },
  { bits = "13:10", value = 0xd },  # PC in the dest slot
  { bits = "15:15", value = 1 },
]
operands = []
modifiers = ["cond"]

[forms.encoding_reference]
bunny_build = "E_HOLD() = 0x1C + (PC<<10) + (1<<15) + (EU<<5)"

# ---------------------------------------------------------------------------
# Vectored: table register replicated into [13:10] and [23:20].
# Bit 9 = 0: no vector byte.  Bit 9 = 1 (ACC form): vectors byte in [31:24].
# ---------------------------------------------------------------------------

[[forms]]
name = "vectored"
syntax = "E_[COND_]VECTORED_HOLD[_LV][_NRA] ([cond,] table)"
mnemonic = { pattern = "E_[COND_]VECTORED_HOLD[_LV][_NRA]", binds = ["cond", "lv", "nra"] }
fixed = [
  { bits = "4:0", value = 0x1c },
  { bits = "9:9", value = 0 },
]
operands = ["table_reg"]
modifiers = ["cond", "nra", "lv"]
notes = "The table register value is emitted into BOTH [13:10] and [23:20] (replicated slice field)."

[forms.encoding_reference]
bunny_build = "E_VECTORED_HOLD(table) = 0x1C + (table<<10) + (table<<20) + (EU<<5)"

[[forms]]
name = "acc_vectored"
syntax = "E_[COND_]ACC_VECTORED_HOLD[_LV][_NRA] ([cond,] table, vectors)"
mnemonic = { pattern = "E_[COND_]ACC_VECTORED_HOLD[_LV][_NRA]", binds = ["cond", "lv", "nra"] }
fixed = [
  { bits = "4:0", value = 0x1c },
  { bits = "9:9", value = 1 },
]
operands = ["table_reg", "vectors8"]
modifiers = ["cond", "nra", "lv"]

[forms.encoding_reference]
bunny_build = "E_ACC_VECTORED_HOLD(table,vec) = 0x1C + (table<<10) + (table<<20) + (1<<9) + (vec<<24) + (EU<<5)"
