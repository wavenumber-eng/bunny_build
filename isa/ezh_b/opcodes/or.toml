# E_OR — opcode 0x0c: or family (ALU matrix).

[opcode]
name = "OR"
value = 0x0c
family = "alu"
mnemonics_base = ["E_OR"]

[semantics]
prose = """
Bitwise ORs two source registers, writing a destination register. The second source
operand can be barrel-shifted (LSL/ASR/LSR/ROR by a 5-bit immediate) and
optionally flipped (F modifier) before the operation. The N modifier inverts
the ALU result. The IMM form replaces the second source with a 12-bit signed
immediate (no shift fusion).
"""
restrictions = [
  "IMM form has no shift fusion (immediate occupies the shift bits)",
]

[timing]
cycles = "1"

[[provenance]]
source = "bunny_build"
detail = "E_OR* encoder formulas (family matrix extracted by isa/tools/extract_header.py)"

[[provenance]]
source = "an14650"
detail = "section 5, E_OR instruction group"

# ---------------------------------------------------------------------------
# Form 1: register-register with optional immediate-shift fusion.
# Plain E_OR[N][S] is LSL with shift5 = 0; E_OR[N]_F[S] is FLSL with shift5 = 0.
# ---------------------------------------------------------------------------

[[forms]]
name = "reg"
syntax = "E_[COND_]OR[N]_[F]{LSL|ASR|LSR|ROR}[S] ([cond,] dest, src1, src2 [, shift5])"
mnemonics = [
  { pattern = "E_[COND_]OR[N][S]", binds = ["cond", "n_alu", "s"] },
  { pattern = "E_[COND_]OR[N]_{LSL=0|ASR=1|LSR=2|ROR=3}[S]", binds = ["cond", "n_alu", "shift_type_alu", "s"] },
  { pattern = "E_[COND_]OR[N]_F[S]", binds = ["cond", "n_alu", "s"], when = { f_alu = 1 } },
  { pattern = "E_[COND_]OR[N]_F{LSL=0|ASR=1|LSR=2|ROR=3}[S]", binds = ["cond", "n_alu", "shift_type_alu", "s"], when = { f_alu = 1 } },
]
fixed = [
  { bits = "4:0", value = 0x0c },
  { bits = "18:18", value = 0 },   # 0 = register form (1 selects immediate form)
]
operands = ["dest", "src1", "src2", "shift5"]
modifiers = ["cond", "s", "n_alu", "f_alu", "shift_type_alu"]
notes = "Mnemonics without a shift suffix are the LSL encoding with shift5 = 0."

[forms.encoding_reference]
bunny_build = "E_OR(dest,src1,src2) = 0xc + (src1<<14) + (dest<<10) + (src2<<20) + (EU<<5)"

# ---------------------------------------------------------------------------
# Form 2: register + 12-bit signed immediate.
# ---------------------------------------------------------------------------

[[forms]]
name = "imm"
syntax = "E_[COND_]OR[N]_IMM[S] ([cond,] dest, src1, imm12s)"
mnemonic = { pattern = "E_[COND_]OR[N]_IMM[S]", binds = ["cond", "n_alu", "s"] }
fixed = [
  { bits = "4:0", value = 0x0c },
  { bits = "18:18", value = 1 },   # immediate form select
]
operands = ["dest", "src1", "imm12s"]
modifiers = ["cond", "s", "n_alu"]

[forms.encoding_reference]
bunny_build = "E_OR_IMM(dest,src1,imm) = 0xc + (src1<<14) + (dest<<10) + ((imm&0xfff)<<20) + (1<<18) + (EU<<5)"
