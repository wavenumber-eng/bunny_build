# E_STR — opcode 0x02: store register to memory (immediate offset).

[opcode]
name = "STR"
value = 0x02
family = "memory"
mnemonics_base = ["E_STR", "E_STRB", "E_PUSH", "E_PUSHB"]

[semantics]
prose = """
Writes a register to memory over the AHB data bus, addressed by a pointer
register plus an 8-bit signed immediate offset (word-scaled for word stores,
byte-scaled for byte stores); B stores the bottom byte. PRE/POST variants
write the offset pointer update back before or after the access. Stores
share E_LDR's submit-and-continue performance. The PUSH aliases are presets
of this form - the stack grows upward, so PUSH post-increments SP by one
word.
(hardware analysis, advisory: byte stores drive the byte on all four AHB byte lanes.)
Note the operand order: the address register comes FIRST
(E_STR(addr, data, offset)) - the reverse of the load spelling's
destination-first order, a classic swapped-store hazard.
"""
restrictions = [
  "Post-increment of PC is not allowed",
  "AN14650 5.25 carries a pointer/post-update cancellation phrased for reads (a 5.24 copy-paste smell); hardware analysis shows no such cancellation for stores - data is latched before the pointer update. Adjudication item",
  "No support for SPO/SNE condition flags",
  "Cannot set flags (no S variant)",
  "PUSH/POP: byte and word stacking must not be mixed across non-word-aligned boundaries - SP bits [1:0] are ignored in word-access address calculation (AN14650 5.29)",
  "Word accesses truncate the address to word alignment (bits [1:0] ignored)",
]

[timing]
cycles = "1+"
notes = "Same performance as E_LDR (AN14650 section 5.25)"

[[provenance]]
source = "bunny_build"
detail = "E_STR*/E_PUSH* encoder formulas"

[[provenance]]
source = "an14650"
detail = "sections 5.25 and 5.29: purpose, byte option, scaled imm offset, PRE/POST, restrictions, performance same as E_LDR; PUSH/POP stack semantics"

[[provenance]]
source = "spec_b_06"
detail = "instruction set chapter, E_STR purpose/options/restrictions (synthesized, not copied)"

[[forms]]
name = "default"
syntax = "E_[COND_]{STRB|STR}[_PRE|_POST] ([cond,] raddr, rdata, offset8s)"
mnemonics = [
  { pattern = "E_[COND_]{STRB=0|STR=1}", binds = ["cond", "word"] },
  { pattern = "E_[COND_]{STRB=0|STR=1}_PRE", binds = ["cond", "word"], when = { wb_st = 1 } },
  { pattern = "E_[COND_]{STRB=0|STR=1}_POST", binds = ["cond", "word"], when = { wb_st = 1, post = 1 } },
]
fixed = [{ bits = "4:0", value = 0x02 }]
operands = ["src1", "src2", "offset8s"]
modifiers = ["cond", "word", "wb_st", "post"]
notes = "Address register rides in src1 [17:14], data register in src2 [23:20]. Writeback is bit 10 (the unused dest slot), unlike the load family's bit 20."

[forms.encoding_reference]
bunny_build = "E_STRB(raddr,rdata,off8) = 0x2 + (raddr<<14) + (rdata<<20) + (off8<<24) + (EU<<5)"

[[aliases]]
name = "PUSH"
form = "default"
operands = ["src2"]
preset = { src1 = 0xc, offset8s = 1, word = 1, wb_st = 1, post = 1 }

[[aliases]]
name = "PUSHB"
form = "default"
operands = ["src2"]
preset = { src1 = 0xc, offset8s = 1, word = 0, wb_st = 1, post = 1 }
