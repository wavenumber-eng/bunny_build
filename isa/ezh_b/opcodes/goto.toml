# E_GOTO — opcode 0x15: branch, absolute immediate or register target.

[opcode]
name = "GOTO"
value = 0x15
family = "control"
mnemonics_base = ["E_GOTO", "E_GOTOL", "E_GOTO_REG", "E_GOTO_REGL"]

[semantics]
prose = """
Branches to a word-aligned target: a 21-bit immediate (label form, bit 9
set) reaching the current 2MB window, or a full 32-bit address from a
register (bit 9 clear). The L variants back up a return address to RA: for a
scheduled branch RA holds PC - 4 (the address after the two unflushed
opcodes); for an ordinary branch, PC + 4. SPO/UNS conditions always schedule
the branch (the next two opcodes still execute); SNE/NZS schedule it when NZ
is set. An ordinary branch flushes the two prefetched opcodes and costs
three cycles; a scheduled branch costs one.
"""
restrictions = [
  "Immediate target must be word aligned (encoding relies on address bits [1:0] being zero)",
  "Immediate target reaches only the current 2MB window: per AN14650 5.22 the top 9 address bits remain those of PC at execution time. bunny_build encodes the low 21 bits of an absolute address ('& 0x1FFFFF'), which is equivalent only while code executes below 0x200000 - window semantics vs absolute assumption is an open adjudication item (affects assembler correctness, not just docs)",
  "Cannot set flags (no S variant)",
]

[timing]
cycles = "1 scheduled / 3 ordinary"
notes = "Single cycle for a scheduled branch (the next two opcodes are not flushed), three cycles for an ordinary branch. SPO/UNS conditions force a scheduled branch; SNE/NZS schedule when NZ is set (AN14650 section 5.22)"

[[provenance]]
source = "bunny_build"
detail = "E_GOTO*/E_GOTO_REG* two-pass label functions in src/bunny_build__instr.c; treats the 21-bit immediate as an absolute low-2MB address"

[[provenance]]
source = "an14650"
detail = "section 5.22: 21-bit window immediate / 32-bit register target, RA backup rules (scheduled PC-4, ordinary PC+4), SPO/UNS and SNE/NZS scheduled-branch conditions, 1-vs-3-cycle performance"

[[provenance]]
source = "spec_b_06"
detail = "instruction set chapter, E_GOTO purpose/options/restrictions (synthesized, not copied)"

[[forms]]
name = "imm"
syntax = "E_[COND_]GOTO[L] ([cond,] label)"
mnemonic = { pattern = "E_[COND_]GOTO[L]", binds = ["cond", "link"] }
fixed = [
  { bits = "4:0", value = 0x15 },
  { bits = "9:9", value = 1 },     # 1 = immediate (label) target
]
operands = ["goto_addr21"]
modifiers = ["cond", "link"]

[forms.encoding_reference]
bunny_build = "E_GOTO(label) = 0x15 + (1<<9) + ((addr & 0x1FFFFF) << 9)"

[[forms]]
name = "reg"
syntax = "E_[COND_]GOTO_REG[L] ([cond,] raddr)"
mnemonic = { pattern = "E_[COND_]GOTO_REG[L]", binds = ["cond", "link"] }
fixed = [
  { bits = "4:0", value = 0x15 },
  { bits = "9:9", value = 0 },     # 0 = register target
]
operands = ["src1"]
modifiers = ["cond", "link"]
notes = "Target address register rides in src1 [17:14]."

[forms.encoding_reference]
bunny_build = "E_GOTO_REG(raddr) = 0x15 + (raddr<<14)"
