# E_GOTO — opcode 0x15: branch, absolute immediate or register target.

[opcode]
name = "GOTO"
value = 0x15
family = "control"
mnemonics_base = ["E_GOTO", "E_GOTOL", "E_GOTO_REG", "E_GOTO_REGL"]

[semantics]
prose = """
Branches to a word-aligned target: a 21-bit word immediate (label form, bit
9 set) reaching the current 8MB window - the top 9 address bits are
preserved from PC - or a full 32-bit address from a register (bit 9 clear).
The L variants back up a return address to RA: after a
scheduled branch RA = the GOTO's address + 12 (the word after the two
unflushed slots); after an ordinary branch RA = the GOTO's address + 4 (the
next word). SPO/UNS conditions always schedule the branch (the next two
opcodes still execute); SNE/NZS schedule it when NZ is set. An ordinary
branch flushes the two prefetched opcodes and costs three cycles; a
scheduled branch costs one.
"""
restrictions = [
  "Immediate target must be word aligned (encoding relies on address bits [1:0] being zero)",
  "Immediate target reaches the current 8MB window: the 21-bit word immediate fills target bits [22:2] and the top 9 address bits are preserved from PC (AN14650 5.22; the hardware computes (PC & 0xff800000) | (imm << 2)). bunny_build masks the byte address with 0x1FFFFF and populates only instr [29:11] - the low 2MB of the window; widening it is a recorded assembler improvement opportunity",
  "Cannot set flags (no S variant)",
]

[timing]
cycles = "1 scheduled / 3 ordinary"
notes = "Single cycle for a scheduled branch (the next two opcodes are not flushed), three cycles for an ordinary branch. SPO/UNS conditions force a scheduled branch; SNE/NZS schedule when NZ is set (AN14650 section 5.22)"

[[provenance]]
source = "bunny_build"
detail = "E_GOTO*/E_GOTO_REG* two-pass label functions in src/bunny_build__instr.c; treats the 21-bit immediate as an absolute low-2MB address"

[[provenance]]
source = "an14650"
detail = "section 5.22: 21-bit window immediate / 32-bit register target, SPO/UNS and SNE/NZS scheduled-branch conditions, 1-vs-3-cycle performance. Its RA PC-4/PC+4 spellings are internally swapped against its own descriptive sentence (defect candidate #5, tentatively resolved per source ranking: the descriptive sentence is correct - scheduled -> GOTO+12, ordinary -> GOTO+4; creator review pending)"

[[provenance]]
source = "spec_b_06"
detail = "instruction set chapter, E_GOTO purpose/options/restrictions (synthesized, not copied)"

[[provenance]]
source = "sv_tb"
detail = "ADVISORY: immediate branch computes (PC & 0xff800000) | (inst[31:11] << 2); RA writes: ordinary -> GOTO+4, scheduled -> GOTO+12"

[[forms]]
name = "imm"
brief = "Branches to the 21-bit word immediate within the current 8MB window"
syntax = "E_[COND_]GOTO[L] ([cond,] label)"
mnemonic = { pattern = "E_[COND_]GOTO[L]", binds = ["cond", "link"] }
fixed = [
  { bits = "4:0", value = 0x15 },
  { bits = "9:9", value = 1 },     # 1 = immediate (label) target
]
operands = ["goto_addr21"]
modifiers = ["cond", "link"]

[forms.encoding_reference]
bunny_build = "E_GOTO(label) = 0x15 + (1<<9) + ((addr & 0x1FFFFF) << 9)"

[[forms]]
name = "reg"
brief = "Branches to the 32-bit address in Raddr"
syntax = "E_[COND_]GOTO_REG[L] ([cond,] raddr)"
mnemonic = { pattern = "E_[COND_]GOTO_REG[L]", binds = ["cond", "link"] }
fixed = [
  { bits = "4:0", value = 0x15 },
  { bits = "9:9", value = 0 },     # 0 = register target
]
operands = ["src1"]
modifiers = ["cond", "link"]
notes = "Target address register rides in src1 [17:14]."

[forms.encoding_reference]
bunny_build = "E_GOTO_REG(raddr) = 0x15 + (raddr<<14)"
