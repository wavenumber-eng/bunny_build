# E_INT_TRIGGER — opcode 0x14: raise interrupt/trigger outputs.

[opcode]
name = "INT_TRIGGER"
value = 0x14
family = "control"
mnemonics_base = ["E_INT_TRIGGER"]

[semantics]
prose = """
Fires a single-cycle pulse on the EZH interrupt outputs: the 24-bit
immediate mask selects which of the 24 individual interrupt channels pulse,
and the common interrupt output always fires regardless of the mask - the
mechanism for signalling the host CPU (frame complete, buffer ready) without
touching a bus.
"""
restrictions = [
  "The common interrupt output triggers regardless of the channel mask",
  "No conditional variant: the 24-bit mask occupies the cond field bits",
  "Cannot set flags (no S variant)",
]

[timing]
cycles = "1"

[[provenance]]
source = "bunny_build"
detail = "E_INT_TRIGGER(x24) = 0x14 + (x24 << 8)"

[[provenance]]
source = "an14650"
detail = "section 5.21: single-cycle interrupt pulse, common output always triggered, channels24imm; Table 12: single cycle"

[[provenance]]
source = "spec_b_06"
detail = "instruction set chapter, E_INT_TRIGGER purpose/options/restrictions (synthesized, not copied)"

[[forms]]
name = "default"
syntax = "E_INT_TRIGGER (x24)"
mnemonic = { pattern = "E_INT_TRIGGER", binds = [] }
fixed = [{ bits = "4:0", value = 0x14 }]
operands = ["x24"]
modifiers = []

[forms.encoding_reference]
bunny_build = "E_INT_TRIGGER(x24) = 0x14 + (x24<<8)"
