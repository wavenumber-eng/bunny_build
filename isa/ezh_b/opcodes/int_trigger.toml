# E_INT_TRIGGER — opcode 0x14: raise interrupt/trigger outputs.

[opcode]
name = "INT_TRIGGER"
value = 0x14
family = "control"
mnemonics_base = ["E_INT_TRIGGER"]

[semantics]
prose = """
Fires a single-cycle pulse on the EZH interrupt outputs: the 24-bit
immediate mask selects which of the 24 individual interrupt channels pulse,
and the common interrupt output always fires regardless of the mask - the
mechanism for signalling the host CPU (frame complete, buffer ready) without
touching a bus.
"""
restrictions = [
  "The common interrupt output triggers regardless of the channel mask - so a zero mask (E_INT_TRIGGER(0)) still raises the common interrupt and is the idiomatic end-of-program signal",
  "No conditional variant: the 24-bit mask occupies the cond field bits",
  "Cannot set flags (no S variant)",
]

[timing]
cycles = "1"

[[provenance]]
source = "bunny_build"
detail = "E_INT_TRIGGER(x24) = 0x14 + (x24 << 8)"

[[provenance]]
source = "an14650"
detail = "section 5.21: single-cycle interrupt pulse, common output always triggered, channels24imm; Table 12: single cycle"

[[provenance]]
source = "spec_b_06"
detail = "instruction set chapter, E_INT_TRIGGER purpose/options/restrictions (synthesized, not copied). AUTHORITATIVE on the zero-argument question: states the opcode triggers the common interrupt output AS WELL AS any of the 24 channels, that the immediate only chooses which channels ('common interrupt always triggered'), and lists Restrictions: None. This contradicts AN14650 4.2.14's claim that the parameter must be > 0; AN14650 5.21 sides with the spec, as does the sample corpus. Resolved toward the spec on the 2026-07-25 authority ranking"

[[provenance]]
source = "sv_tb"
detail = "ADVISORY: e_int executes unconditionally and applies no constraint to the immediate; it declines to push a zero value onto the expected-interrupt queue only because a zero on the channel bus is indistinguishable from idle for the checker - a testbench observability note, not a hardware restriction"

[[forms]]
name = "default"
brief = "Pulses the selected interrupt channels (the common output always fires)"
syntax = "E_INT_TRIGGER (x24)"
mnemonic = { pattern = "E_INT_TRIGGER", binds = [] }
fixed = [{ bits = "4:0", value = 0x14 }]
operands = ["x24"]
modifiers = []

[forms.encoding_reference]
bunny_build = "E_INT_TRIGGER(x24) = 0x14 + (x24<<8)"
