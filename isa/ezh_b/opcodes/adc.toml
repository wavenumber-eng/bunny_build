# E_ADC — opcode 0x09: adc family (ALU matrix).

[opcode]
name = "ADC"
value = 0x09
family = "alu"
mnemonics_base = ["E_ADC"]

[semantics]
prose = """
Adds with carry (dest = src1 + src2 + C) - the building block for
multi-word arithmetic.
The result then passes through the optional post-stages in mnemonic-spelling
order: N inverts it, F flips its byte order, and a fused LSL/LSR/ASR/ROR
shifts or rotates it by a 0-31 immediate; flags (S) update last. The IMM form
uses a 12-bit signed immediate with N and S only (the immediate occupies the
shift bits). Writing PC as the destination branches - an ordinary
branch unless S is set, which makes it a scheduled branch (and sets no
flags).
SPO/SNE conditions are legal with this family - the algorithmic
shift+ALU idiom (see the shift family for their full semantics).
"""
restrictions = [
  "S with destination PC does not set flags (schedules branch instead)",
  "IMM form has no shift fusion (immediate occupies the shift bits)",
]

[timing]
cycles = "1"

[[provenance]]
source = "bunny_build"
detail = "E_ADC* encoder formulas (family matrix extracted by isa/tools/extract_header.py)"

[[provenance]]
source = "an14650"
detail = "section 5.4: purpose, options (invertible data, result byte-order flip, postshift 0-31), imm12s, PC restriction; Table 12: single cycle"

[[provenance]]
source = "spec_b_06"
detail = "instruction set chapter, E_ADC purpose/options/restrictions (synthesized, not copied)"

# ---------------------------------------------------------------------------
# Form 1: register-register with optional immediate-shift fusion.
# Plain E_ADC[N][S] is LSL with shift5 = 0; E_ADC[N]_F[S] is FLSL with shift5 = 0.
# ---------------------------------------------------------------------------
[[forms]]
name = "reg"
syntax = "E_[COND_]ADC[N]_[F]{LSL|ASR|LSR|ROR}[S] ([cond,] dest, src1, src2 [, shift5])"
mnemonics = [
  { pattern = "E_[COND_]ADC[N][S]", binds = ["cond", "n_alu", "s"] },
  { pattern = "E_[COND_]ADC[N]_{LSL=0|ASR=1|LSR=2|ROR=3}[S]", binds = ["cond", "n_alu", "shift_type_alu", "s"] },
  { pattern = "E_[COND_]ADC[N]_F[S]", binds = ["cond", "n_alu", "s"], when = { f_alu = 1 } },
  { pattern = "E_[COND_]ADC[N]_F{LSL=0|ASR=1|LSR=2|ROR=3}[S]", binds = ["cond", "n_alu", "shift_type_alu", "s"], when = { f_alu = 1 } },
]
fixed = [
  { bits = "4:0", value = 0x09 },
  { bits = "18:18", value = 0 },   # 0 = register form (1 selects immediate form)
]
operands = ["dest", "src1", "src2", "shift5"]
modifiers = ["cond", "s", "n_alu", "f_alu", "shift_type_alu"]
notes = "Mnemonics without a shift suffix are the LSL encoding with shift5 = 0."

[forms.encoding_reference]
bunny_build = "E_ADC(dest,src1,src2) = 0x9 + (src1<<14) + (dest<<10) + (src2<<20) + (EU<<5)"

# ---------------------------------------------------------------------------
# Form 2: register + 12-bit signed immediate.
# ---------------------------------------------------------------------------

[[forms]]
name = "imm"
syntax = "E_[COND_]ADC[N]_IMM[S] ([cond,] dest, src1, imm12s)"
mnemonic = { pattern = "E_[COND_]ADC[N]_IMM[S]", binds = ["cond", "n_alu", "s"] }
fixed = [
  { bits = "4:0", value = 0x09 },
  { bits = "18:18", value = 1 },   # immediate form select
]
operands = ["dest", "src1", "imm12s"]
modifiers = ["cond", "s", "n_alu"]

[forms.encoding_reference]
bunny_build = "E_ADC_IMM(dest,src1,imm) = 0x9 + (src1<<14) + (dest<<10) + ((imm&0xfff)<<20) + (1<<18) + (EU<<5)"
