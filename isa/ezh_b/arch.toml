# EZH Architecture B — architecture-level shared definitions.
# Single source of truth; see isa/README.md and ADR isa-adr-0001.

[arch]
name = "ezh_b"
title = "NXP EZH Architecture B (SmartDMA)"
instruction_width = 32
opcode_bits = "4:0"
# GOSUB overlays every encoding whose bits [1:0] == 0b11; decoders must match
# most-specific-first (sort forms by mask popcount, descending).

# ---------------------------------------------------------------------------
# Register file: 4-bit register addresses used by dest/src fields.
# ---------------------------------------------------------------------------

[registers.R0]
value = 0x0
class = "gpr"
desc = "General purpose register 0"

[registers.R1]
value = 0x1
class = "gpr"
desc = "General purpose register 1"

[registers.R2]
value = 0x2
class = "gpr"
desc = "General purpose register 2"

[registers.R3]
value = 0x3
class = "gpr"
desc = "General purpose register 3"

[registers.R4]
value = 0x4
class = "gpr"
desc = "General purpose register 4"

[registers.R5]
value = 0x5
class = "gpr"
desc = "General purpose register 5"

[registers.R6]
value = 0x6
class = "gpr"
desc = "General purpose register 6"

[registers.R7]
value = 0x7
class = "gpr"
desc = "General purpose register 7"

[registers.GPO]
value = 0x8
class = "io"
desc = "General purpose outputs"

[registers.GPD]
value = 0x9
class = "io"
desc = "General purpose output direction/enable"

[registers.CFS]
value = 0xa
class = "control"
desc = "Boolean detector bit-slice config source: 8x3-bit slice source selects plus 8 slice-input bits"

[registers.CFM]
value = 0xb
class = "control"
desc = "Boolean detector bit-slice config mux: 8x3-bit slice mux selects plus 8 enable-OR bits"

[registers.SP]
value = 0xc
class = "control"
desc = "Stack pointer"

[registers.PC]
value = 0xd
class = "control"
desc = "Program counter; writing PC branches - ordinary unless the op sets flags (S), which requests a scheduled branch instead of setting flags. A PC source read yields the pipeline fetch position; the architecture chapter documents the current +8-byte model and bench-confirmation note"

[registers.GPI]
value = 0xe
class = "io"
desc = "General purpose inputs; also the discard destination when a result should not be stored (the CMP/TST idiom: S-variant op with dest = GPI)"

[registers.RA]
value = 0xf
class = "control"
desc = "Return address"

# ---------------------------------------------------------------------------
# Condition codes: 4-bit values for the cond field (instruction bits [8:5]).
# EU = execute unconditionally.
# ---------------------------------------------------------------------------

[conditions.EU]
value = 0x0
desc = "Execute unconditionally"

[conditions.ZE]
value = 0x1
desc = "Zero flag set"

[conditions.NZ]
value = 0x2
desc = "Zero flag not set"

[conditions.PO]
value = 0x3
desc = "Positive"

[conditions.NE]
value = 0x4
desc = "Negative"

[conditions.AZ]
value = 0x5
desc = "Above zero (ARM GT)"

[conditions.ZB]
value = 0x6
desc = "Zero or below"

[conditions.CA]
value = 0x7
desc = "Carry set"

[conditions.NC]
value = 0x8
desc = "Carry not set"

[conditions.CZ]
value = 0x9
desc = "Carry set and zero (spec table wording)"

[conditions.SPO]
value = 0xa
alias = ["UNS"]
desc = "Algorithmic shift-only-when-positive: cancels the fused ALU stage when the algorithmic-positive flag is set (the shift still executes; N inversion is not cancelled); latches only from ops conditioned on it. As a GOTO condition, UNS = unconditionally scheduled branch"

[conditions.SNE]
value = 0xb
alias = ["NZS"]
desc = "Algorithmic shift-only-when-negative: cancels the fused ALU stage when the algorithmic-negative flag is set (the shift still executes; N inversion is not cancelled); latches only from ops conditioned on it. As a GOTO condition, NZS = scheduled branch iff NZ is set"

[conditions.NBS]
value = 0xc
desc = "Boolean slice not set"

[conditions.NEX]
value = 0xd
desc = "External flag not set"

[conditions.BS]
value = 0xe
desc = "Boolean slice set"

[conditions.EX]
value = 0xf
desc = "External flag set"

# ---------------------------------------------------------------------------
# Bit-slice mux configurations (boolean pattern detector inputs).
# ---------------------------------------------------------------------------

[bit_slice_cfg.BS_1]
value = 0
desc = "Constant 1"

[bit_slice_cfg.BS_RISE]
value = 1
desc = "Rising edge"

[bit_slice_cfg.BS_FALL]
value = 2
desc = "Falling edge"

[bit_slice_cfg.BS_CHANGE]
value = 3
desc = "Any edge"

[bit_slice_cfg.BS_SIG]
value = 4
desc = "Signal level"

[bit_slice_cfg.BS_SIGN]
value = 5
desc = "Signal level inverted"

[bit_slice_cfg.BS_0]
value = 6
desc = "Constant 0"

[bit_slice_cfg.BS_EVENT]
value = 7
desc = "Event input"

# ---------------------------------------------------------------------------
# Provenance source ids, referenced by opcode files.
# ---------------------------------------------------------------------------

[sources.spec_b_06]
title = "EZHandler Arch B PreRel0.6 (EZH creator)"
public = false
note = """NXP confidential; informs, never copied. AUTHORITY #1 FOR BEHAVIOR \
(Eli, 2026-07-25): written by the EZH creator, so where it and AN14650 \
disagree the spec wins. Note this is an authority ranking, NOT a citation \
ranking - the spec stays unquotable and unrenderable; AN14650 remains the \
citable source. Caveats: it is core-level only (no EZHB_* wrapper registers), \
and it is internally inconsistent in places (DFETCH chapter vs E_LDR section on \
write-stall), so a traced worked example still beats a prose sentence."""

[sources.an14650]
title = "AN14650 SmartDMA Cookbook Rev 1.0 (2025-05-28)"
public = true
note = """Public NXP application note; THE citable source - all rendered \
citations come from here. Authority-wise it ranks BELOW the creator's spec for \
behavior (Eli, 2026-07-25): it is a later third-party rewrite and carries known \
defects (its SPO/SNE summary bullet contradicts its own worked example; its \
EZH_SetEmergencyMode listing contradicts its own register table; its flag table \
omits NZ). It is authoritative for the EZHB_* wrapper registers, which the \
core-level spec does not cover at all."""

[sources.nxp_chipdata]
title = "NXP MCUXpresso Config Tools chip data (per part, fetched via nxp-monkey)"
public = true
note = """Vendor machine-readable register/pin/interrupt descriptions - the \
RM-grounding source the plan's strategy note calls for, and citable. \
Authoritative for the EZHB_*/SMARTDMA wrapper block, IRQ numbers, INPUTMUX \
trigger maps and pin mux, none of which the core-level spec covers. Peripheral \
is named SMARTDMA0 on MCX parts. Caveat: it gives field names, widths and \
descriptions, and enumerated values for some fields but not all - where enums \
are absent, polarity is inferred from NXP's own naming convention (positive \
names EN/START/RQ vs explicitly negative ERRDIS) and should be marked as an \
inference."""

[sources.fsl_header]
title = "fsl_ezh_armclang.h (hand-created by the EZH creator)"
public = false
note = "Best available encoding reference; NXP confidential banner"

[sources.bunny_build]
title = "bunny_build__instr.h / .c encoders"
public = true
note = "Validated by MCX camera byte-for-byte test"

[sources.sv_tb]
title = "ezh_tb_package.sv"
public = false
note = """INTERNAL ONLY - never rendered or named in output fields. Advisory \
for encodings (the hand-written header is primary). DEMOTED FOR BEHAVIOR (Eli, \
2026-07-25): it was an experiment, so where the creator's spec speaks directly \
the spec wins - it is authoritative only where the spec is silent or \
self-contradictory. Still valuable for questions no prose source addresses \
(pipeline mechanics, PC arithmetic, dispatch geometry). Creator review remains \
the final gate"""

# ---------------------------------------------------------------------------
# Glossary: architecture terms used across the opcode pages.
# ---------------------------------------------------------------------------

[glossary.naming]
desc = "EZH and SmartDMA are the same block. SmartDMA is NXP's official name in public documentation and in silicon register naming (SMARTDMA0, SMARTDMAARCHB_INMUX, SMARTDMA_IRQn, SMARTDMA_PIO). EZH ('EZ Handler') is the original architecture name and survives in the programmer-facing surface: the E_* mnemonics, the fsl_ezh_* headers, and the EZHB_* control registers. House convention (Eli, 2026-07-25): use EZH for architecture and instruction-set discussion, SmartDMA for part-specific material, because that is what a Reference Manual or SDK will call it. Readers arrive searching for either term, so both must resolve everywhere."

[glossary.flags]
desc = "ALU flags update only when an instruction sets them: S-suffixed ops (plus algorithmic latching for SPO/SNE). Z is set iff the 32-bit result is zero; N is result bit 31; C changes only through ADD/SUB/ADC/SBC and shift/rotate stages - logical ops and MOV retain the previous carry even with S. Every other instruction (branches, GOSUB, holds, all data-bus accesses) leaves the flags untouched, so flag state survives across them."

[glossary.scheduled_branch]
desc = "A branch that lets the two already-prefetched opcodes execute instead of flushing them, costing one cycle instead of three. Requested by S+PC-destination ALU ops, by GOTO under UNS/NZS, and used by accelerated vectored holds."

[glossary.unflushed_opcodes]
desc = "The two instructions the pipeline has already fetched when a branch executes (PC runs two instructions ahead). An ordinary branch flushes them; a scheduled branch executes them."

[glossary.dfetch]
desc = "The data-fetch unit: queues one data-bus transaction so execution continues past a load/store; execution stalls only when an instruction consumes a register whose data has not returned."

[glossary.execution_supervisor]
desc = "The zero-overhead loop engine configured by E_TIGHT_LOOP: tracks loop end address and iteration count, repeating the block with no branch instructions."
