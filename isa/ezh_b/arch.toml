# ---------------------------------------------------------------------------
# Glossary: architecture terms used across the opcode pages.
# ---------------------------------------------------------------------------

[glossary.flags]
desc = "ALU flags update only when an instruction sets them: S-suffixed ops (plus algorithmic latching for SPO/SNE). Z is set iff the 32-bit result is zero; N is result bit 31; C changes only through ADD/SUB/ADC/SBC and shift/rotate stages - logical ops and MOV retain the previous carry even with S. Every other instruction (branches, GOSUB, holds, all data-bus accesses) leaves the flags untouched, so flag state survives across them."

[glossary.scheduled_branch]
desc = "A branch that lets the two already-prefetched opcodes execute instead of flushing them, costing one cycle instead of three. Requested by S+PC-destination ALU ops, by GOTO under UNS/NZS, and used by accelerated vectored holds."

[glossary.unflushed_opcodes]
desc = "The two instructions the pipeline has already fetched when a branch executes (PC runs two instructions ahead). An ordinary branch flushes them; a scheduled branch executes them."

[glossary.dfetch]
desc = "The data-fetch unit: queues one data-bus transaction so execution continues past a load/store; execution stalls only when an instruction consumes a register whose data has not returned."

[glossary.execution_supervisor]
desc = "The zero-overhead loop engine configured by E_TIGHT_LOOP: tracks loop end address and iteration count, repeating the block with no branch instructions."
